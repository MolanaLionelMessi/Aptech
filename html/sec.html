<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloura | Order Confirmed</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main style="min-height: 100vh; display: grid; place-items: center; padding: 32px; background: linear-gradient(180deg, #f5efe9 0%, #fffaf6 100%);">
      <div style="max-width: 760px; background: rgba(255,255,255,0.8); border: 1px solid rgba(29, 27, 26, 0.08); border-radius: 30px; padding: 48px 32px; text-align: center; box-shadow: 0 24px 60px rgba(26,22,18,.1);">
        <p class="eyebrow" style="display:inline-block; margin-bottom: 18px;">Order confirmed</p>
        <h1 style="font-size: clamp(2.8rem, 5vw, 4.4rem); margin-bottom: 18px;">Thank you for shopping at Veloura.</h1>
        <p style="font-size: 1.05rem; max-width: 560px; margin: 0 auto 28px;">
          Your new statement pieces are on the way. Expect a confirmation email with your order details shortly.
        </p>
        <a href="login.html" class="btn btn-primary">Continue shopping</a>
      </div>
    </main>
  </body>
</html>
